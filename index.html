<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MY DREAM SETLIST 產生器</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }

    body {
      background-color: #121212;
      color: #ffffff;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }

    h1 {
      margin-bottom: 8px;
      font-size: 26px;
      color: #00ffcc;
      text-shadow: 0 2px 10px rgba(0,0,0,0.5);
    }

    p.subtitle {
      font-size: 14px;
      color: #ddd;
      margin-bottom: 20px;
      text-shadow: 0 1px 5px rgba(0,0,0,0.5);
    }

    .controls {
      margin-bottom: 20px;
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      justify-content: center;
      align-items: center;
    }

    .input-text {
      background-color: #333;
      color: #fff;
      border: 1px solid #555;
      padding: 10px 15px;
      font-size: 14px;
      border-radius: 20px;
      outline: none;
      transition: all 0.2s ease;
    }

    .input-text:focus {
      border-color: #00ffcc;
      box-shadow: 0 0 8px rgba(0, 255, 204, 0.4);
    }

    .btn {
      background-color: #00ffcc;
      color: #000;
      border: none;
      padding: 10px 20px;
      font-size: 14px;
      font-weight: bold;
      border-radius: 20px;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.4);
      transition: all 0.2s ease;
    }

    .btn:hover {
      transform: scale(1.05);
      background-color: #00e6b8;
    }

    .btn-secondary {
      background-color: #333;
      color: #fff;
      border: 1px solid #555;
    }

    .btn-secondary:hover {
      background-color: #444;
    }

    /* 9:16 畫布卡片 */
    #playlist-card {
      width: 360px;
      height: 640px; /* 9:16 比例 */
      background: linear-gradient(135deg, rgba(26,26,46,0.95) 0%, rgba(22,33,62,0.95) 50%, rgba(15,52,96,0.95) 100%);
      background-size: cover;
      background-position: center;
      backdrop-filter: blur(10px);
      border-radius: 16px;
      padding: 16px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.8);
      display: flex;
      flex-direction: column;
      position: relative;
    }

    /* 背景遮罩 */
    #playlist-card::before {
      content: "";
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0, 0, 0, 0.35);
      border-radius: 16px;
      z-index: 0;
      pointer-events: none;
    }

    .card-header, .song-grid, .card-footer {
      position: relative;
      z-index: 1;
    }

    .card-header {
      text-align: center;
      margin-bottom: 10px;
    }

    .card-header h2 {
      font-size: 18px;
      letter-spacing: 2px;
      color: #ffffff;
    }

    .card-header p {
      font-size: 10px;
      color: #00ffcc;
      letter-spacing: 1px;
    }

    /* 30 個選單雙欄排版 */
    .song-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      grid-template-rows: repeat(15, 1fr);
      gap: 3px 6px;
      flex-grow: 1;
    }

    .song-item {
      display: flex;
      align-items: center;
      background: rgba(0, 0, 0, 0.35);
      backdrop-filter: blur(4px);
      border-radius: 4px;
      padding: 2px 4px;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.08);
    }

    .song-num {
      font-size: 10px;
      font-weight: bold;
      color: #00ffcc;
      width: 16px;
      flex-shrink: 0;
    }

    /* 歌名可打字搜尋輸入框 */
    .song-input {
      width: calc(100% - 16px);
      background: rgba(0, 0, 0, 0.4);
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 2px;
      color: #ffffff;
      font-size: 9px;
      padding: 2px 4px;
      outline: none;
    }

    .song-input::placeholder {
      color: rgba(255,255,255,0.4);
    }

    /* 導出時顯示的純文字標籤 */
    .export-text {
      display: none;
      font-size: 9px;
      color: #ffffff;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      width: calc(100% - 16px);
      text-shadow: 0 1px 3px rgba(0,0,0,0.8);
      padding-left: 2px;
    }

    /* 導出狀態樣式 */
    .exporting .song-input {
      display: none !important;
    }

    .exporting .export-text {
      display: block !important;
    }

    .card-footer {
      text-align: center;
      font-size: 8px;
      color: #aaa;
      margin-top: 6px;
      text-shadow: 0 1px 2px rgba(0,0,0,0.8);
    }
  </style>
</head>
<body>

  <h1>MY DREAM SETLIST</h1>
  <p class="subtitle">自訂歌單</p>

  <div class="controls">
    <!-- 自訂創作者名稱輸入框 -->
    <input type="text" id="authorInput" class="input-text" placeholder="輸入名字 / ID" value="Input ID" oninput="updateFooter()">

    <!-- 上傳自訂圖片作為 9:16 卡片背景 -->
    <button class="btn btn-secondary" onclick="document.getElementById('cardBgInput').click()">Upload Background</button>
    <input type="file" id="cardBgInput" accept="image/*" style="display: none;" onchange="uploadCardBackground(event)">
    
    <button class="btn" onclick="downloadImage()">📸 Export </button>
  </div>

  <!-- 9:16 歌單卡片主體 -->

    <div class="song-grid" id="songGrid">
      <!-- 30 個選項將由 JavaScript 自動生成 -->

    <div class="card-footer" id="cardFooter">
      CREATED BY <span id="authorName">HK-MYDAY</span> @<span id="footerDate"></span>
    </div>
  </div>

    // 初始化 datalist 歌名選單
    const datalist = document.getElementById('song-list-data');
    songList.forEach(song => {
      const option = document.createElement('option');
      option.value = song;
      datalist.appendChild(option);
    });

    const gridContainer = document.getElementById('songGrid');

    // 建立 30 個可搜尋/選取的歌名輸入框
    for (let i = 1; i <= 30; i++) {
      const item = document.createElement('div');
      item.className = 'song-item';
      const numStr = i < 10 ? `0${i}` : `${i}`;

      item.innerHTML = `
        <span class="song-num">${numStr}</span>
        <input type="text" list="song-list-data" class="song-input" id="song-input-${i}" placeholder="搜尋或揀歌曲" oninput="updateExportText(${i})">
        <span class="export-text" id="export-text-${i}">-</span>
      `;
      gridContainer.appendChild(item);
    }

    function updateExportText(index) {
      const inputVal = document.getElementById(`song-input-${index}`).value.trim();
      const exportText = document.getElementById(`export-text-${index}`);
      exportText.textContent = inputVal || "-";
    }

    // 上傳圖片作為卡片背景
    function uploadCardBackground(event) {
      const file = event.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = function(e) {
          const card = document.getElementById('playlist-card');
          card.style.backgroundImage = `url('${e.target.result}')`;
        }
        reader.readAsDataURL(file);
      }
    }

    // 高清導出 9:16 圖片功能
    function downloadImage() {
      const card = document.getElementById('playlist-card');
      
      card.classList.add('exporting');

      html2canvas(card, {
        scale: 3,
        useCORS: true,
        backgroundColor: null
      }).then(canvas => {
        const link = document.createElement('a');
        link.download = 'My_Dream_Setlist.png';
        link.href = canvas.toDataURL('image/png');
        link.click();
        
        card.classList.remove('exporting');
      });
    }

    // 自動更新 Footer 名字與日期 (Format: DD/MM/YYYY)
    function updateFooter() {
      const inputVal = document.getElementById('authorInput').value.trim();
      document.getElementById('authorName').textContent = inputVal || "HK-MYDAY";

      const today = new Date();
      const day = String(today.getDate()).padStart(2, '0');
      const month = String(today.getMonth() + 1).padStart(2, '0');
      const year = today.getFullYear();
      
      document.getElementById('footerDate').textContent = `${day}/${month}/${year}`;
    }

    // 頁面載入時執行初始化
    updateFooter();

</html>
